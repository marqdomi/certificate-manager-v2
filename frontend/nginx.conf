# frontend/nginx.conf
# Nginx configuration for serving React SPA in production

server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # DNS resolver for dynamic proxy_pass (Azure DNS + Google DNS fallback)
    resolver 168.63.129.16 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Healthcheck endpoint
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
    
    # Static assets with long cache (hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Proxy API requests to backend
    location /api/ {
        # Use internal IP directly (avoids DNS resolution issues)
        proxy_pass https://10.105.68.204;
        proxy_http_version 1.1;
        
        # CRITICAL: Set Host header for SNI routing
        proxy_set_header Host ca-certmgr-backend-int.politecliff-926aefa5.centralus.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSL - skip verification for internal IP
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name ca-certmgr-backend-int.politecliff-926aefa5.centralus.azurecontainerapps.io;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
